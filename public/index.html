<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Insurance Service Desk</title><style>*{box-sizing:border-box}body{margin:auto;max-width:1050px;padding:32px 20px;background:#f4f7f7;color:#163a40;font:16px/1.55 system-ui}header{border-bottom:3px solid #00745c}h1{font-size:clamp(32px,5vw,52px);margin:8px 0}section{background:white;border:1px solid #bfd0ce;padding:20px;border-radius:10px;margin:16px 0}label{display:block;font-weight:600;margin:10px 0}select,input,textarea,button{padding:11px;font:inherit;border:1px solid #849c99;border-radius:5px}textarea,input,select{display:block;width:100%}textarea{min-height:140px}button{background:#006552;color:white;cursor:pointer;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header>Independent applicant project · InsuranceDekho<h1>Insurance Service Desk</h1></header><section><div class="grid"><label>Review tool<select id="agent"><option value="claim-query-reconciler">Claim query reconciliation</option><option value="proposal-disclosure-checker">Proposal disclosure check</option><option value="renewal-terms-reviewer">Renewal terms review</option></select></label><label>Analysis mode<select id="mode"><option value="rules">Rules · no API key needed</option><option value="claude">Claude · AI evidence review</option></select></label></div><label id="keylabel" hidden>Claude API key (optional with server key)<input id="key" type="password" autocomplete="off"></label><label>Workspace password<input id="pw" type="password"></label><p id="hint"></p><div class="grid"><label><span id="left"></span><textarea id="a"></textarea></label><label><span id="right"></span><textarea id="b"></textarea></label></div><button id="sample">Load fictional example</button><button id="run">Run review</button><button id="history">Recent saved reviews</button></section><section aria-live="polite"><h2>Review results</h2><pre id="output">Choose a tool and run the sample.</pre><button id="exportBtn" disabled>Download JSON</button></section><script>
const $=id=>document.getElementById(id),examples=[['Final bill | signed\nDischarge summary | signed\nInvoice | itemised','Final bill | signed @ ACK-017\nDischarge summary | unsigned'],['Mira diabetes | yes\nDev diabetes | no','Mira diabetes | no\nDev diabetes | no'],['Premium | INR 18000\nCo-pay | 0%','Premium | INR 20400\nCo-pay | 20%']],labels=[['Insurer request','Submission register'],['Confirmed disclosures','Draft proposal'],['Expiring terms','Renewal offer']];let result;
function load(){const i=$('agent').selectedIndex;[$('left').textContent,$('right').textContent]=labels[i];[$('a').value,$('b').value]=examples[i];$('hint').textContent=$('mode').value==='claude'?'Source text is sent to Claude. Use fictional or authorized records.':'Enter one field | value per line.'+(i===0?' Add @ receipt after each submitted value.':'');$('keylabel').style.display=$('mode').value==='claude'?'block':'none';$('output').textContent='Ready for review.';$('exportBtn').disabled=true}
$('agent').onchange=$('sample').onclick=load;$('mode').onchange=()=>{const a=$('a').value,b=$('b').value;load();$('a').value=a;$('b').value=b};load();
async function request(history){$('run').disabled=$('history').disabled=true;$('exportBtn').disabled=true;$('output').textContent='Working…';try{const headers={'Content-Type':'application/json','x-desk-password':$('pw').value};if(!history&&$('mode').value==='claude'&&$('key').value)headers['x-model-key']=$('key').value;const r=await fetch('/api/review',{method:history?'GET':'POST',headers,body:history?undefined:JSON.stringify(Object.fromEntries(['agent','mode','a','b'].map(k=>[k,$(k).value])))});const data=await r.json();if(!r.ok)throw Error(data.error);result=data;$('output').textContent=history?(data.history.length?JSON.stringify(data.history,null,2):data.database?'No saved reviews.':'Neon is disconnected. Reviews are available for download.'):(data.saved?'Saved to Neon':'Session only')+'\n\n'+data.findings.map(f=>[f.field+' — '+f.status,f.a_quote||'(no source A evidence)',f.b_quote||'(no source B evidence)',f.action].join('\n')).join('\n\n');$('exportBtn').disabled=false}catch(e){$('output').textContent=e.message}finally{$('run').disabled=$('history').disabled=false}}
$('run').onclick=()=>request(false);$('history').onclick=()=>request(true);$('exportBtn').onclick=()=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));l.download='insurance-review.json';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),500)};
</script></html>
