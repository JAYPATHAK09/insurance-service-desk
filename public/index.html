<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Insurance Service Desk</title><style>*{box-sizing:border-box}body{margin:auto;max-width:1050px;padding:32px 20px;background:#f4f7f7;color:#163a40;font:16px/1.55 system-ui}header{border-bottom:3px solid #00745c}h1{font-size:clamp(32px,5vw,52px);margin:8px 0}section{background:white;border:1px solid #bfd0ce;padding:20px;border-radius:10px;margin:16px 0}label{display:block;font-weight:600;margin:10px 0}select,input,textarea,button{padding:11px;font:inherit;border:1px solid #849c99;border-radius:5px}textarea,input,select{display:block;width:100%}textarea{min-height:140px}button{background:#006552;color:white;cursor:pointer;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><header>Independent applicant project · InsuranceDekho<h1>Insurance Service Desk</h1></header><section><div class="grid"><label>Review tool<select id="agent"><option value="claim-query-reconciler">Claim query reconciliation</option><option value="proposal-disclosure-checker">Proposal disclosure check</option><option value="renewal-terms-reviewer">Renewal terms review</option></select></label><label>Analysis mode<select id="mode"><option value="rules">Rules · no API key needed</option><option value="claude">Claude · AI evidence review</option></select></label></div><label id="keylabel" hidden>Claude API key (optional with server key)<input id="key" type="password" autocomplete="off"></label><label>Workspace password<input id="pw" type="password"></label><p id="hint"></p><div class="grid"><label><span id="left"></span><input type="file" aria-label="Import first text file" data-side="a" accept=".txt,.md"><textarea id="a"></textarea></label><label><span id="right"></span><input type="file" aria-label="Import second text file" data-side="b" accept=".txt,.md"><textarea id="b"></textarea></label></div><button id="sample">Load fictional example</button><button id="run">Run review</button><button id="history">Recent saved reviews</button></section><section aria-live="polite"><h2>Review results</h2><pre id="output">Choose a tool and run the sample.</pre><div id="cases"></div><button id="exportBtn" disabled>Download JSON</button></section><script>
const $=id=>document.getElementById(id),examples=[['Final bill | signed\nDischarge summary | signed\nInvoice | itemised','Final bill | signed @ ACK-017\nDischarge summary | unsigned'],['Mira diabetes | yes\nDev diabetes | no','Mira diabetes | no\nDev diabetes | no'],['Premium | INR 18000\nCo-pay | 0%','Premium | INR 20400\nCo-pay | 20%']],labels=[['Insurer request','Submission register'],['Confirmed disclosures','Draft proposal'],['Expiring terms','Renewal offer']];let result;
function load(){ $('cases').replaceChildren();const i=$('agent').selectedIndex;[$('left').textContent,$('right').textContent]=labels[i];[$('a').value,$('b').value]=examples[i];$('hint').textContent=$('mode').value==='claude'?'Source text is sent to Claude. Use fictional or authorized records.':'Enter one field | value per line.'+(i===0?' Add @ receipt after each submitted value.':'');$('keylabel').style.display=$('mode').value==='claude'?'block':'none';$('output').textContent='Ready for review.';$('exportBtn').disabled=true}
const requestedTool=new URLSearchParams(location.search).get('tool');
if(Array.from($('agent').options).some(option=>option.value===requestedTool)) $('agent').value=requestedTool;
$('sample').onclick=load;
$('agent').onchange=()=>{const url=new URL(location.href);url.searchParams.set('tool',$('agent').value);window.history.replaceState(null,'',url);load()};$('mode').onchange=()=>{const a=$('a').value,b=$('b').value;load();$('a').value=a;$('b').value=b};load();
async function request(history){ $('cases').replaceChildren();$('run').disabled=$('history').disabled=true;$('exportBtn').disabled=true;$('output').textContent='Working…';try{const headers={'Content-Type':'application/json','x-desk-password':$('pw').value};if(!history&&$('mode').value==='claude'&&$('key').value)headers['x-model-key']=$('key').value;const r=await fetch('/api/review',{method:history?'GET':'POST',headers,body:history?undefined:JSON.stringify(Object.fromEntries(['agent','mode','a','b'].map(k=>[k,$(k).value])))});const data=await r.json();if(!r.ok)throw Error(data.error);result=data;$('output').textContent=history?(data.history.length?JSON.stringify(data.history,null,2):data.database?'No saved reviews.':'Neon is disconnected. Reviews are available for download.'):(data.saved?'Saved to Neon':'Session only')+'\n\n'+data.findings.map(f=>[f.field+' — '+f.status,f.a_quote||'(no source A evidence)',f.b_quote||'(no source B evidence)',f.action].join('\n')).join('\n\n');display(data,history);$('exportBtn').disabled=false}catch(e){$('output').textContent=e.message}finally{$('run').disabled=$('history').disabled=false}}
$('run').onclick=()=>request(false);$('history').onclick=()=>request(true);$('exportBtn').onclick=()=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));l.download='insurance-review.json';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),500)};

function element(tag,text){const node=document.createElement(tag);node.textContent=text;return node}
function display(data,history){
 const list=history?data.history:[data];if(!list.length)return;
 $('output').textContent=history?'Recent case reviews':data.saved?'Saved to Neon':'Session only';
 for(const row of list){
  const card=document.createElement('details');card.open=!history;
  const name=Array.from($('agent').options).find(o=>o.value===row.agent)?.text||row.agent;
  card.append(element('summary',name+' · '+(row.created_at?new Date(row.created_at).toLocaleString():row.mode)));
  for(const finding of row.findings){
   card.append(element('h3',finding.field+' · '+finding.status));
   const pair=element('div','');pair.className='grid';pair.append(element('pre',finding.a_quote||'No first-source evidence'),element('pre',finding.b_quote||'No second-source evidence'));card.append(pair,element('p',finding.action));
  }
  const log=element('div','');card.append(log);const actions=row.actions||=[];const showAction=a=>log.append(element('p',a.decision+' · '+a.note));actions.forEach(showAction);
  if(history||row.saved){
   const decision=element('select','');decision.setAttribute('aria-label','Review decision');for(const x of ['Needs follow-up','Verified','Reopened'])decision.append(element('option',x));
   const note=element('textarea','');note.placeholder='Reason for decision';note.maxLength=2000;note.setAttribute('aria-label','Reviewer note');
   const save=element('button','Record decision'),status=element('p','');save.onclick=async()=>{save.disabled=true;try{
    const response=await fetch('/api/review',{method:'PATCH',headers:{'Content-Type':'application/json','x-desk-password':$('pw').value},body:JSON.stringify({id:row.id,decision:decision.value,note:note.value})});
    const action=await response.json();if(!response.ok)throw Error(action.error);actions.push(action);showAction(action);note.value='';status.textContent='Decision saved.';
   }catch(e){status.textContent=e.message}finally{save.disabled=false}};card.append(decision,note,save,status);
  }$('cases').append(card);
 }
}
for(const input of document.querySelectorAll('[data-side]'))input.onchange=async()=>{const file=input.files[0];if(!file)return;if(file.size>120000){$('output').textContent='File exceeds the text limit.';return}const text=await file.text();if(text.length>30000){$('output').textContent='Maximum 30,000 characters per source.';return}$(input.dataset.side).value=text};
</script></html>
