<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Insurance Service Desk</title><style>
*{box-sizing:border-box}html{border-top:4px solid #e42745;background:#fbfbfa;color:#202025;font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{max-width:1060px;margin:auto;padding:34px clamp(18px,4vw,54px) 72px}header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;color:#56565d;font-size:.88rem}h1,h2,h3,p{margin:0}h1{color:#17171b;font-size:clamp(1.8rem,4vw,2.65rem);letter-spacing:-.06em}h2{font-size:1.35rem;letter-spacing:-.035em}h3{font-size:1.08rem}nav{display:flex;gap:1.4rem;margin:22px 0 30px;border-bottom:1px solid #d9d9db}nav a{color:#58585d;text-decoration:none;font-weight:600;padding:0 0 10px;border-bottom:2px solid transparent}nav a[aria-current]{color:#ae1530;border-color:#d41b38}.study{background:#202027;color:#fff;padding:clamp(22px,4vw,40px);border-radius:16px}.study small{color:#fac4ce}.study h2{font-size:clamp(1.65rem,4vw,2.55rem);letter-spacing:-.045em;line-height:1.13;margin:9px 0 12px}.study p{max-width:74ch;color:#e3e3e6}.study details{margin-top:16px;border-top:1px solid #49494e;padding-top:13px}.study details p{margin-top:8px}summary,button{cursor:pointer}section{margin-top:20px;border:1px solid #dddde0;border-radius:14px;padding:clamp(16px,3vw,28px);background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-size:.94rem;font-weight:600;margin:8px 0}input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{display:block;width:100%;padding:10px 12px;border:1px solid #ccccd1;border-radius:7px;margin:6px 0;background:white}textarea{resize:vertical;min-height:140px;font: .92rem/1.6 ui-monospace,monospace}input[type=file]{font-weight:400;font-size:.84rem;background:#f8f8f8}button{padding:9px 14px;border-radius:8px;border:1px solid #d6d6db;background:white;margin:5px 5px 0 0}button:hover{background:#f4f3f3}#run{background:#b51935;color:white;border-color:#b51935;font-weight:650}button:disabled{opacity:.5}#hint,#output{color:#54545c;font-size:.94rem;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}#cases details{border-top:1px solid #ddd;padding:14px 0}#cases h3{margin-top:18px}#cases pre{background:#f5f5f6;padding:12px;border-radius:7px}summary{font-weight:600}:focus-visible{outline:3px solid #ad3255;outline-offset:3px}[hidden]{display:none!important}@media(max-width:680px){header{display:block}.grid{grid-template-columns:1fr;gap:4px}nav{margin:16px 0}.study{padding:20px}} .study #demo{background:white;color:#202027;margin-top:16px;border:none;padding:10px 18px}.study #demo:hover{background:#f4e9eb}</style><header><h1>Insurance Service Desk</h1><span>Independent project for InsuranceDekho</span></header><nav aria-label="Review workflows"><a href="?tool=claim-query-reconciler">Claims</a><a href="?tool=proposal-disclosure-checker">Proposals</a><a href="?tool=renewal-terms-reviewer">Renewals</a></nav><article class="study" id="study"><small>Fictional case study</small><h2 id="studyTitle"></h2><p id="story"></p><p><small>Try the worked case without signing in.</small></p><button id="demo" type="button">Try demo</button><details id="walk"><summary>Expected reviewer decision</summary><p id="answer"></p></details></article><section><h2>Review workspace</h2><div class="grid"><label hidden>Review tool<select id="agent"><option value="claim-query-reconciler">Claim query reconciliation</option><option value="proposal-disclosure-checker">Proposal disclosure check</option><option value="renewal-terms-reviewer">Renewal terms review</option></select></label><label>Analysis mode<select id="mode"><option value="rules">Rules · no API key needed</option><option value="claude">Claude · AI evidence review</option></select></label></div><label id="keylabel" style="display:none">Your Claude API key<input id="key" type="password" autocomplete="off"></label><p id="hint"></p><div class="grid"><label><span id="left"></span><input type="file" aria-label="Import first text file" data-side="a" accept=".txt,.md"><textarea id="a"></textarea></label><label><span id="right"></span><input type="file" aria-label="Import second text file" data-side="b" accept=".txt,.md"><textarea id="b"></textarea></label></div><button id="sample">Restore case inputs</button><button id="run">Run review</button></section><section aria-live="polite"><h2>Review results</h2><pre id="output">Choose a tool and run the sample.</pre><div id="cases"></div><button id="exportBtn" disabled>Download JSON</button></section><script>
const $=id=>document.getElementById(id),studies=[{"title":"The second request for a hospital bill","story":"A reimbursement handler receives a three-item insurer query. The family already uploaded the final bill. Check the submission register before calling them again.","a":"Final hospital bill | signed, stay 12–15 Oct\nDischarge summary | signed by consultant\nPharmacy invoice | itemised","b":"Final hospital bill | signed, stay 12–15 Oct @ ACK-1742\nDischarge summary | unsigned scan @ ACK-1743","answer":"Verify the bill against ACK-1742 and cite the receipt in the insurer reply. Ask the hospital for a signed discharge summary. Check whether the itemised pharmacy invoice was filed under another name before asking the family for it."},{"title":"Two family members, one incorrect answer","story":"Mira and Dev apply for a family policy. The advisor has their confirmed answers and a draft proposal awaiting signature. Check each field against the correct person.","a":"Mira · diabetes | yes, diagnosed 2020\nMira · prior surgery | appendectomy, 2019\nDev · diabetes | no","b":"Mira · diabetes | no\nMira · prior surgery | \nDev · diabetes | no","answer":"Mira’s diabetes answer conflicts with her confirmation, and her surgery answer is blank. Return both fields to the advisor for confirmation and correction before signature. Dev’s recorded answer matches."},{"title":"A ₹2,400 increase with a change in cover","story":"A renewal advisor compares two schedules for the same member and plan. The expiring terms below include the latest endorsement. Work out what the customer needs to hear before renewing.","a":"Annual premium | INR 18000\nCo-pay on admissible claims | 0%\nRoom entitlement | single private room","b":"Annual premium | INR 20400\nCo-pay on admissible claims | 20%\nRoom entitlement | single private room","answer":"The annual premium rises by ₹2,400 (13.3%). Under the example renewal wording, a ₹1 lakh admissible claim would carry a ₹20,000 customer share from co-pay alone. The room category matches. Verify the wording and record the customer’s acknowledgement."}],examples=studies.map(c=>[c.a,c.b]),labels=[['Insurer request','Submission register'],['Confirmed disclosures','Draft proposal'],['Expiring terms','Renewal offer']];let result;
function load(){document.querySelectorAll("nav a").forEach(link=>{if(link.search==="?tool="+$("agent").value)link.setAttribute("aria-current","page");else link.removeAttribute("aria-current")}); $('cases').replaceChildren();const i=$('agent').selectedIndex;const study=studies[i];$('studyTitle').textContent=study.title;$('story').textContent=study.story;$('answer').textContent=study.answer;$('walk').open=false;[$('left').textContent,$('right').textContent]=labels[i];[$('a').value,$('b').value]=examples[i];$('hint').textContent=$('mode').value==='claude'?'Source text is sent to Claude. Use fictional or authorized records.':'Enter one field | value per line.'+(i===0?' Add @ receipt after each submitted value.':'');$('keylabel').style.display=$('mode').value==='claude'?'block':'none';$('output').textContent='Ready for review.';$('exportBtn').disabled=true}
const requestedTool=new URLSearchParams(location.search).get('tool');
if(Array.from($('agent').options).some(option=>option.value===requestedTool)) $('agent').value=requestedTool;
$('sample').onclick=load;
$('agent').onchange=()=>{const url=new URL(location.href);url.searchParams.set('tool',$('agent').value);window.history.replaceState(null,'',url);load()};$('mode').onchange=()=>{const a=$('a').value,b=$('b').value;load();$('a').value=a;$('b').value=b};load();
async function request(){
 $('cases').replaceChildren();$('run').disabled=true;$('exportBtn').disabled=true;$('output').textContent='Working…';
 try{
  const headers={'Content-Type':'application/json'};
  if($('mode').value==='claude')headers['x-model-key']=$('key').value;
  const body={sessionOnly:true,...Object.fromEntries(['agent','mode','a','b'].map(k=>[k,$(k).value]))};
  const response=await fetch('/api/review',{method:'POST',headers,body:JSON.stringify(body)});
  const data=await response.json();if(!response.ok)throw Error(data.error);
  result=data;display(data,false);$('exportBtn').disabled=false;
 }catch(e){$('output').textContent=e.message}finally{$('run').disabled=false}
}
$('run').onclick=request;$('exportBtn').onclick=()=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));l.download='insurance-review.json';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),500)};

const sampleFindings=[[{"field":"final hospital bill","status":"receipt located","a_quote":"Final hospital bill | signed, stay 12–15 Oct","b_quote":"Final hospital bill | signed, stay 12–15 Oct @ ACK-1742","action":"Claims handler: verify the signed bill and quote ACK-1742 in the insurer reply before contacting the family."},{"field":"discharge summary","status":"partial evidence","a_quote":"Discharge summary | signed by consultant","b_quote":"Discharge summary | unsigned scan @ ACK-1743","action":"Hospital liaison: request a consultant-signed copy. ACK-1743 refers to the unsigned scan."},{"field":"pharmacy invoice","status":"missing","a_quote":"Pharmacy invoice | itemised","b_quote":"","action":"Claims handler: check the itemised pharmacy invoice under alternate filenames, then request it if still outstanding."}],[{"field":"mira · diabetes","status":"contradiction","a_quote":"Mira · diabetes | yes, diagnosed 2020","b_quote":"Mira · diabetes | no","action":"Advisor: confirm Mira’s recorded diagnosis with her and correct the draft before signature."},{"field":"mira · prior surgery","status":"needs confirmation","a_quote":"Mira · prior surgery | appendectomy, 2019","b_quote":"Mira · prior surgery | ","action":"Advisor: confirm the surgery details and complete Mira’s unanswered field before signature."},{"field":"dev · diabetes","status":"consistent","a_quote":"Dev · diabetes | no","b_quote":"Dev · diabetes | no","action":"Advisor: retain Dev’s confirmed answer on his own member record."}],[{"field":"annual premium","status":"changed","a_quote":"Annual premium | INR 18000","b_quote":"Annual premium | INR 20400","action":"Renewal advisor: explain the ₹2,400 annual increase (13.3%) and confirm the offer period."},{"field":"co-pay on admissible claims","status":"changed","a_quote":"Co-pay on admissible claims | 0%","b_quote":"Co-pay on admissible claims | 20%","action":"Renewal advisor: illustrate the new share. A ₹1 lakh admissible claim implies ₹20,000 from co-pay alone under these example terms."},{"field":"room entitlement","status":"unchanged","a_quote":"Room entitlement | single private room","b_quote":"Room entitlement | single private room","action":"Renewal advisor: record that both schedules specify a single private room."}]];
$('demo').onclick=()=>{
 const i=$('agent').selectedIndex;
 result={agent:$('agent').value,mode:'demo',saved:false,findings:sampleFindings[i]};
 $('cases').replaceChildren();
 display(result,false);
 $('exportBtn').disabled=false;
 $('output').scrollIntoView({block:'start'});
};
function element(tag,text){const node=document.createElement(tag);node.textContent=text;return node}
function display(data,history){
 const list=history?data.history:[data];if(!list.length)return;
 $('output').textContent=history?'Recent case reviews':data.saved?'Saved to Neon':data.mode==='demo'?'Fictional case · demo only':'Session only';
 for(const row of list){
  const card=document.createElement('details');card.open=!history;
  const name=Array.from($('agent').options).find(o=>o.value===row.agent)?.text||row.agent;
  card.append(element('summary',name+' · '+(row.created_at?new Date(row.created_at).toLocaleString():row.mode)));
  for(const finding of row.findings){
   card.append(element('h3',finding.field+' · '+finding.status));
   const pair=element('div','');pair.className='grid';pair.append(element('pre',finding.a_quote||'No first-source evidence'),element('pre',finding.b_quote||'No second-source evidence'));card.append(pair,element('p',finding.action));
  }
  const log=element('div','');card.append(log);const actions=row.actions||=[];const showAction=a=>log.append(element('p',a.decision+' · '+a.note));actions.forEach(showAction);
  $('cases').append(card);
 }
}
for(const input of document.querySelectorAll('[data-side]'))input.onchange=async()=>{const file=input.files[0];if(!file)return;if(file.size>120000){$('output').textContent='File exceeds the text limit.';return}const text=await file.text();if(text.length>30000){$('output').textContent='Maximum 30,000 characters per source.';return}$(input.dataset.side).value=text};
</script></html>
